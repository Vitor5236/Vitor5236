<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#0E1730"/>
      <stop offset="1" stop-color="#0A0F1E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="358" rx="19" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="1000" cy="120" r="260" fill="url(#glow)"/>

  <!-- faint grid dots -->
  <g fill="#1E293B">
    <!-- row generator omitted; static subtle dots -->
    <circle cx="60" cy="300" r="1.5"/><circle cx="100" cy="300" r="1.5"/><circle cx="140" cy="300" r="1.5"/>
    <circle cx="60" cy="330" r="1.5"/><circle cx="100" cy="330" r="1.5"/><circle cx="140" cy="330" r="1.5"/>
  </g>

  <!-- left: identity -->
  <g transform="translate(64, 96)">
    <text x="0" y="0" fill="#64748B" font-size="15" font-weight="600" letter-spacing="4">DATA · CLOUD · ENGINEERING · AI</text>
    <text x="-2" y="66" fill="#F1F5F9" font-size="62" font-weight="800" letter-spacing="-1">João Vitor</text>
    <text x="0" y="108" font-size="20" font-weight="600">
      <tspan fill="url(#accent)">Data Engineer</tspan><tspan fill="#475569"> · </tspan><tspan fill="#CBD5E1">Cloud</tspan><tspan fill="#475569"> · </tspan><tspan fill="#CBD5E1">Data Architecture</tspan><tspan fill="#475569"> · </tspan><tspan fill="#CBD5E1">Software</tspan><tspan fill="#475569"> · </tspan><tspan fill="#CBD5E1">AI</tspan>
    </text>
    <text x="0" y="150" fill="#94A3B8" font-size="16.5" font-weight="400">Building the path from raw data to decisions —</text>
    <text x="0" y="176" fill="#94A3B8" font-size="16.5" font-weight="400">data platforms, cloud infrastructure &amp; intelligent software.</text>
  </g>

  <!-- right: data -> cloud -> AI flow motif -->
  <g transform="translate(880, 150)" stroke-linecap="round">
    <!-- connecting flow lines -->
    <path d="M40 40 C 110 40, 110 40, 170 40" stroke="url(#accent2)" stroke-width="2.5" fill="none" opacity="0.9"/>
    <path d="M210 40 C 270 40, 270 40, 320 40" stroke="url(#accent)" stroke-width="2.5" fill="none" opacity="0.9"/>
    <path d="M40 40 C 90 40, 90 -30, 170 -30" stroke="#334155" stroke-width="2" fill="none"/>
    <path d="M40 40 C 90 40, 90 110, 170 110" stroke="#334155" stroke-width="2" fill="none"/>

    <!-- node: sources / data (cylinder) -->
    <g transform="translate(10, 18)">
      <ellipse cx="15" cy="6" rx="15" ry="6" fill="#0F172A" stroke="url(#accent2)" stroke-width="2"/>
      <path d="M0 6 V 38 A 15 6 0 0 0 30 38 V 6" fill="#0F172A" stroke="url(#accent2)" stroke-width="2"/>
      <ellipse cx="15" cy="22" rx="15" ry="6" fill="none" stroke="url(#accent2)" stroke-width="1.2" opacity="0.6"/>
    </g>

    <!-- node: processing (hex/chip) -->
    <g transform="translate(150, 12)">
      <rect x="0" y="0" width="56" height="56" rx="12" fill="#0F172A" stroke="url(#accent2)" stroke-width="2"/>
      <circle cx="28" cy="28" r="10" fill="none" stroke="url(#accent2)" stroke-width="2"/>
      <path d="M28 8 v-8 M28 56 v8 M8 28 h-8 M56 28 h8" stroke="url(#accent2)" stroke-width="2"/>
    </g>

    <!-- node: cloud -->
    <g transform="translate(300, 12)">
      <path d="M18 44 a14 14 0 0 1 2 -27 a18 18 0 0 1 34 4 a12 12 0 0 1 -2 23 Z" fill="#0F172A" stroke="url(#accent)" stroke-width="2"/>
    </g>

    <!-- node: AI (neural) top -->
    <g transform="translate(170, -50)">
      <circle cx="0" cy="0" r="7" fill="#0F172A" stroke="url(#accent)" stroke-width="2"/>
      <circle cx="34" cy="-10" r="7" fill="#0F172A" stroke="url(#accent)" stroke-width="2"/>
      <circle cx="34" cy="12" r="7" fill="#0F172A" stroke="url(#accent)" stroke-width="2"/>
      <path d="M7 0 L27 -10 M7 0 L27 12" stroke="#334155" stroke-width="1.5"/>
    </g>

    <!-- node: warehouse/table bottom -->
    <g transform="translate(168, 92)">
      <rect x="0" y="0" width="44" height="34" rx="5" fill="#0F172A" stroke="#475569" stroke-width="2"/>
      <path d="M0 12 H44 M0 23 H44 M15 12 V34 M29 12 V34" stroke="#475569" stroke-width="1.3"/>
    </g>
  </g>
</svg>
